<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辞書エディター</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --head: #f6f8fa;
      --focus: #ddf4ff;
      --accent: #0969da;
      --danger: #cf222e;
      --dup: #fff1e5;
      --ok: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --line: #30363d;
        --head: #161b22;
        --focus: #132a44;
        --accent: #4493f8;
        --danger: #f85149;
        --dup: #3d2b12;
        --ok: #3fb950;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --line: #30363d;
      --head: #161b22;
      --focus: #132a44;
      --accent: #4493f8;
      --danger: #f85149;
      --dup: #3d2b12;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    /* Scrollbars follow the theme colors above (standard properties, Chrome 121+). */
    html, body, .grid-wrap {
      scrollbar-width: thin;
      scrollbar-color: var(--line) var(--head);
    }
    body {
      margin: 0;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    }
    h1 { font-size: 18px; margin: 0 12px 0 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row + .row { margin-top: 8px; }
    input[type="text"], input[type="search"] {
      font: inherit;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      min-width: 0;
    }
    button {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    .grid-wrap {
      margin-top: 10px;
      overflow: auto;
      max-height: calc(100vh - 200px);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    table { border-collapse: collapse; }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head);
      text-align: left;
      font-weight: 600;
      padding: 6px 8px;
      border: 1px solid var(--line);
      white-space: nowrap;
      user-select: none;
    }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { color: var(--accent); }
    tbody td { border: 1px solid var(--line); padding: 0; }
    tbody td.rownum {
      background: var(--head);
      color: var(--muted);
      text-align: right;
      padding: 0 8px;
      width: 1%;
      white-space: nowrap;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
    tbody td.check { text-align: center; width: 1%; }
    tbody td.del { width: 1%; }
    td input[type="text"] {
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 6px 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    td input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--focus); }
    td input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
    td button.remove { border: 0; padding: 4px 8px; color: var(--danger); background: transparent; }
    tr.invalid td input[type="text"].word { color: var(--danger); }
    tr.dup td { background: var(--dup); }
    /* Use only the width the content needs. */
    .grid-wrap { width: max-content; max-width: 100%; }
    .add-term { width: fit-content; max-width: 100%; }
    /* Two columns: controls on the left, the term table on the right. */
    .layout { display: flex; flex-direction: column; gap: 12px; }
    .side { display: flex; flex-direction: column; gap: 8px; }
    .side .row + .row { margin-top: 0; }
    .side #search, .side .add-term { width: 100%; max-width: none; }
    .side #newWord, .side #newMeaning { width: 100%; flex: 1 1 100%; }
    .main { min-width: 0; }
    .main .grid-wrap { max-height: calc(100vh - 170px); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .main .grid-wrap { max-height: 60vh; }
    }
    table { width: max-content; }
    td input.word { width: 240px; }
    td input.meaning { width: 300px; }
    #newWord { width: 240px; }
    #newMeaning { width: 300px; }
    .add-term { margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--head); }
    .add-term input[type="text"] { flex: 0 0 auto; }
    .add-term label { display: inline-flex; gap: 4px; align-items: center; }
    .pager select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .status { min-height: 1.5em; margin-top: 8px; }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .problem { color: var(--danger); }
    .helper.ok { color: var(--ok); }
    .helper.off { color: var(--danger); }
    button.link { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .grid-wrap { max-height: calc(100vh - 260px); }
    }
  </style>
</head>
<body>
  <header class="row">
    <h1>辞書エディター</h1>
    <span class="muted">1 行 = 1 単語。意味は空欄でもかまいません（空欄なら英語のまま）。</span>
  </header>

  <div class="layout">
  <aside class="side">
  <div class="row">
    <button id="reload" type="button">再読み込み</button>
    <span class="helper" id="helper"></span>
    <button id="helperStop" class="link" type="button" hidden>ヘルパーを停止</button>
  </div>

  <div class="row">
    <input id="search" type="search" placeholder="検索（単語または意味）" autocomplete="off">
    <span class="muted" id="count"></span>
    <span class="problem" id="problems"></span>
  </div>

  <div class="row add-term" role="group" aria-label="単語を追加">
    <input id="newWord" type="text" placeholder="単語（必須、例: private subnet）" autocomplete="off">
    <input id="newMeaning" type="text" placeholder="意味（任意、例: プライベートサブネット）" autocomplete="off">
    <label><input id="newExact" type="checkbox"> 大文字小文字を区別</label>
    <button id="addTerm" class="primary" type="button">追加</button>
  </div>

  <div class="row">
    <button id="register" class="primary" type="button" disabled>登録</button>
    <button id="cancel" type="button" hidden>キャンセル</button>
    <span class="muted" id="changes"></span>
  </div>
  <div class="status" id="status" role="status"></div>
  <p class="muted">
    Excel から行をコピーして単語欄に貼り付けると、複数行をまとめて追加できます。
    列の順序は <b>単語 · 意味 · 大文字小文字の区別(Y)</b> です。Enter で下の欄に移動します。
  </p>
  </aside>

  <section class="main">
  <div class="row pager" aria-label="ページ">
    <button id="firstPage" type="button">«</button>
    <button id="prevPage" type="button">‹ 前へ</button>
    <span class="muted" id="pageInfo"></span>
    <button id="nextPage" type="button">次へ ›</button>
    <button id="lastPage" type="button">»</button>
    <label class="muted">1 ページあたり
      <select id="pageSize">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </label>
  </div>

  <div class="grid-wrap" id="grid">
    <table>
      <thead>
        <tr>
          <th></th>
          <th class="sortable" data-key="word">単語 <span class="arrow"></span></th>
          <th class="sortable" data-key="meaning">意味 <span class="arrow"></span></th>
          <th class="sortable" data-key="exact">大文字小文字の区別 <span class="arrow"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
